<div class="card p-4 shadow-sm mb-4">
    <form method="GET" action="{% url 'home' %}"> <div class="row g-3">
            <div class="col-md-2">
                <label class="form-label">Pojemność (L)</label>
                <input type="number" name="volume" class="form-control" value="{{ query_params.volume|default:60 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Temp. (°C)</label>
                <input type="number" step="0.5" name="temp" class="form-control" value="{{ query_params.temp|default:25 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Odczyn (pH)</label>
                <input type="number" step="0.1" name="ph" class="form-control" value="{{ query_params.ph|default:7.0 }}">
            </div>
            <div class="col-md-3 d-flex align-items-center justify-content-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="strict_biotope" id="biotopeCheck" 
                        {% if query_params.strict_biotope %}checked{% endif %}>
                    <label class="form-check-label" for="biotopeCheck">Tylko ten sam biotop</label>
                </div>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100 py-2">Oblicz obsadę</button>
            </div>
        </div>
    </form>
</div>
