<div class="card p-4 shadow-sm">
    <form method="GET">
        <div class="row g-3">
            <div class="col-md-2">
                <label class="form-label">Pojemność (L)</label>
                <input type="number" name="volume" class="form-control" value="{{ request.GET.volume|default:60 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Temperatura (°C)</label>
                <input type="number" step="0.5" name="temp" class="form-control" value="{{ request.GET.temp|default:25 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Odczyn (pH)</label>
                <input type="number" step="0.1" name="ph" class="form-control" value="{{ request.GET.ph|default:7.0 }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Twardość (dH)</label>
                <input type="number" step="1" name="hardness" class="form-control" value="{{ request.GET.hardness|default:10 }}">
            </div>
            <div class="col-md-2 d-flex align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="strict_biotope" id="biotopeCheck" 
                        {% if request.GET.strict_biotope %}checked{% endif %}>
                    <label class="form-check-label" for="biotopeCheck">
                        Tylko ten sam biotop
                    </label>
                </div>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Oblicz Obsadę</button>
            </div>
        </div>
    </form>
</div>
